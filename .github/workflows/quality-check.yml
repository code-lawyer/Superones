name: Repository quality check

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 22 * * *" # Beijing 06:30.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault2077-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/run-acquisition-inbox-e2e.mjs
      - run: node scripts/run-content-pipeline-e2e.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r collector/requirements-dev.txt
      - run: ruff check collector
      - run: python -m unittest discover -s collector/tests -p "test_*.py"
