name: Repository quality check

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 22 * * *" # Beijing 06:30.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault2077-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run bootstrap:verify
      - run: npm run build
      - run: node scripts/run-acquisition-inbox-e2e.mjs
      - run: node scripts/run-content-pipeline-e2e.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r collector/requirements-dev.lock
      - run: ruff check collector
      - run: python -m unittest discover -s collector/tests -p "test_*.py"
