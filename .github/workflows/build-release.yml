name: Build production release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault2077-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.1"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run bootstrap:verify
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Keep production dependencies only
        run: npm prune --omit=dev
      - name: Package release
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/vault2077-${GITHUB_SHA}.tar.gz"
          stage="$RUNNER_TEMP/vault2077-build"
          rm -rf "$stage"
          mkdir -p "$stage/data"
          cp -a .next node_modules public config migrations scripts lib deploy package.json package-lock.json next.config.ts "$stage/"
          cp -a data/bootstrap "$stage/data/"
          cp -a data/defaults "$stage/data/"
          test -f "$stage/.next/BUILD_ID"
          test -f "$stage/package.json"
          test ! -e "$stage/archive"
          test ! -e "$stage/docs"
          test ! -e "$stage/.github"
          test ! -e "$stage/.impeccable"
          tar -C "$RUNNER_TEMP" -czf "$artifact" "$(basename "$stage")"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          echo "artifact=$artifact" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vault2077-linux-x64-${{ github.sha }}
          path: |
            ${{ env.artifact }}
            ${{ env.artifact }}.sha256
          if-no-files-found: error
          retention-days: 14
