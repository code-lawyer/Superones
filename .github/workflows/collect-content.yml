name: Collect and deliver one acquisition lane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Acquisition lane
        required: true
        type: choice
        options:
          - information
          - roadside
          - sic
          - rankings
      run_mode:
        description: Incremental schedule or one-time launch bootstrap
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - bootstrap
      require_delivery:
        description: Require domestic VPS delivery
        required: true
        default: false
        type: boolean
  schedule:
    # All schedules are UTC. Beijing = UTC+8.
    - cron: "5 0,2,4,6,8,10,12,14 * * *"   # Information: Beijing 08:05-22:05, every 2 hours.
    - cron: "55 0,2,4,6,8,10,12,14 * * *"  # Roadside: Beijing 08:55-22:55, every 2 hours.
    - cron: "25 0 * * *"                    # SiC: Beijing 08:25 daily.
    - cron: "35 0,4,8,12 * * *"             # Rankings: Beijing 08:35/12:35/16:35/20:35.

permissions:
  contents: read

concurrency:
  # GitHub cancels older pending runs when unrelated lanes share one group.
  # Isolate collection by lane; the domestic inbox remains the global serial queue.
  group: vault2077-acquisition-${{ inputs.run_mode || 'incremental' }}-${{ inputs.lane || github.event.schedule }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.16.0"
          cache: npm
      - id: lane
        name: Resolve scheduled lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_LANE: ${{ inputs.lane }}
          MANUAL_RUN_MODE: ${{ inputs.run_mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            lane="$MANUAL_LANE"
            run_mode="$MANUAL_RUN_MODE"
          else
            run_mode="incremental"
            case "$CRON" in
              "5 0,2,4,6,8,10,12,14 * * *") lane="information" ;;
              "55 0,2,4,6,8,10,12,14 * * *") lane="roadside" ;;
              "25 0 * * *") lane="sic" ;;
              "35 0,4,8,12 * * *") lane="rankings" ;;
              *) echo "Unknown schedule: $CRON" >&2; exit 1 ;;
            esac
          fi
          echo "value=$lane" >> "$GITHUB_OUTPUT"
          echo "run_mode=$run_mode" >> "$GITHUB_OUTPUT"
          echo "schedule_id=${run_mode}:${lane}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Initialize run evidence
        run: node --experimental-strip-types scripts/initialize-acquisition-evidence.ts
        env:
          VAULT2077_ACQUISITION_LANE: ${{ steps.lane.outputs.value }}
          VAULT2077_ACQUISITION_RUN_MODE: ${{ steps.lane.outputs.run_mode }}
          VAULT2077_SCHEDULE_ID: ${{ steps.lane.outputs.schedule_id }}
          VAULT2077_COLLECTOR_OUTPUT_DIR: .collector-output
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.lane.outputs.value == 'information' || steps.lane.outputs.value == 'roadside'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install overseas feed collectors
        if: steps.lane.outputs.value == 'information' || steps.lane.outputs.value == 'roadside'
        run: |
          pip install --require-hashes -r collector/requirements.lock
      - id: collect
        name: Collect and reliably deliver one lane
        run: npm run acquisition:collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAULT2077_ACQUISITION_LANE: ${{ steps.lane.outputs.value }}
          VAULT2077_ACQUISITION_RUN_MODE: ${{ steps.lane.outputs.run_mode }}
          VAULT2077_SCHEDULE_ID: ${{ steps.lane.outputs.schedule_id }}
          VAULT2077_COLLECTOR_OUTPUT_DIR: .collector-output
          VAULT2077_DOMESTIC_ACQUISITION_URL: ${{ secrets.VAULT2077_DOMESTIC_ACQUISITION_URL }}
          VAULT2077_FRONTIER_PUBLIC_TASKS_URL: ${{ secrets.VAULT2077_FRONTIER_PUBLIC_TASKS_URL }}
          VAULT2077_FRONTIER_TASKS_SECRET: ${{ secrets.VAULT2077_FRONTIER_TASKS_SECRET }}
          VAULT2077_PIPELINE_SIGNING_KEYS: ${{ secrets.VAULT2077_PIPELINE_SIGNING_KEYS }}
          VAULT2077_PIPELINE_ACTIVE_KEY_ID: ${{ secrets.VAULT2077_PIPELINE_ACTIVE_KEY_ID }}
          VAULT2077_REQUIRE_DOMESTIC_DELIVERY: ${{ github.event_name == 'schedule' || inputs.require_delivery }}
          VAULT2077_DELIVERY_ATTEMPTS: "4"
          VAULT2077_DELIVERY_TIMEOUT_MS: "60000"
          VAULT2077_DELIVERY_RETRY_BASE_MS: "1000"
      - name: Finalize interrupted run evidence
        if: always()
        run: node --experimental-strip-types scripts/finalize-acquisition-evidence.ts
        env:
          VAULT2077_COLLECTOR_OUTPUT_DIR: .collector-output
      - name: Validate run evidence
        if: always()
        run: npm run acquisition:validate-artifact
      - name: Preserve packets and lane report
        if: ${{ always() && hashFiles('.collector-output/.validated-for-upload') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vault2077-${{ steps.lane.outputs.run_mode }}-${{ steps.lane.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .collector-output/run-manifest.json
            .collector-output/acquisition-report.json
            .collector-output/acquisition-batches
            .collector-output/.validated-for-upload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
