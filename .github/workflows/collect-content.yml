name: Collect and deliver one acquisition lane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Acquisition lane
        required: true
        type: choice
        options:
          - information
          - roadside
          - sic
          - rankings
      run_mode:
        description: Incremental schedule or one-time launch bootstrap
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - bootstrap
      require_delivery:
        description: Require domestic VPS delivery
        required: true
        default: false
        type: boolean
  schedule:
    # All schedules are UTC. Beijing = UTC+8.
    - cron: "5 */2 * * *"       # Information: even Beijing hours at :05.
    - cron: "55 */2 * * *"      # Roadside: even Beijing hours at :55.
    - cron: "25 11,23 * * *"    # SiC: Beijing 07:25 / 19:25.
    - cron: "35 * * * *"        # Rankings: hourly at :35.

permissions:
  contents: read

concurrency:
  # GitHub cancels older pending runs when unrelated lanes share one group.
  # Isolate collection by lane; the domestic inbox remains the global serial queue.
  group: vault2077-acquisition-${{ inputs.run_mode || 'incremental' }}-${{ inputs.lane || github.event.schedule }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: lane
        name: Resolve scheduled lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_LANE: ${{ inputs.lane }}
          MANUAL_RUN_MODE: ${{ inputs.run_mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            lane="$MANUAL_LANE"
            run_mode="$MANUAL_RUN_MODE"
          else
            run_mode="incremental"
            case "$CRON" in
              "5 */2 * * *") lane="information" ;;
              "55 */2 * * *") lane="roadside" ;;
              "25 11,23 * * *") lane="sic" ;;
              "35 * * * *") lane="rankings" ;;
              *) echo "Unknown schedule: $CRON" >&2; exit 1 ;;
            esac
          fi
          echo "value=$lane" >> "$GITHUB_OUTPUT"
          echo "run_mode=$run_mode" >> "$GITHUB_OUTPUT"
          echo "schedule_id=${run_mode}:${lane}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.lane.outputs.value == 'information' || steps.lane.outputs.value == 'roadside'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test overseas feed collectors
        if: steps.lane.outputs.value == 'information' || steps.lane.outputs.value == 'roadside'
        run: |
          pip install -r collector/requirements.txt
          python -m unittest discover -s collector/tests -p "test_*.py"
      - name: Collect, deliver, and process one lane
        run: npm run acquisition:collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAULT2077_ACQUISITION_LANE: ${{ steps.lane.outputs.value }}
          VAULT2077_ACQUISITION_RUN_MODE: ${{ steps.lane.outputs.run_mode }}
          VAULT2077_SCHEDULE_ID: ${{ steps.lane.outputs.schedule_id }}
          VAULT2077_COLLECTOR_OUTPUT_DIR: .collector-output
          VAULT2077_DOMESTIC_ACQUISITION_URL: ${{ secrets.VAULT2077_DOMESTIC_ACQUISITION_URL }}
          VAULT2077_DOMESTIC_ACQUISITION_PROCESS_URL: ${{ secrets.VAULT2077_DOMESTIC_ACQUISITION_PROCESS_URL }}
          VAULT2077_FRONTIER_PUBLIC_TASKS_URL: ${{ secrets.VAULT2077_FRONTIER_PUBLIC_TASKS_URL }}
          VAULT2077_PIPELINE_SHARED_SECRET: ${{ secrets.VAULT2077_PIPELINE_SHARED_SECRET }}
          VAULT2077_PIPELINE_WORKER_SECRET: ${{ secrets.VAULT2077_PIPELINE_WORKER_SECRET }}
          VAULT2077_REQUIRE_DOMESTIC_DELIVERY: ${{ github.event_name == 'schedule' || inputs.require_delivery }}
          VAULT2077_PROCESS_TIMEOUT_SECONDS: "1800"
      - name: Preserve packets and lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault2077-${{ steps.lane.outputs.run_mode }}-${{ steps.lane.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .collector-output
          if-no-files-found: warn
          retention-days: 14
